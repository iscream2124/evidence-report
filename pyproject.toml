[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-report"
version = "0.2.0"
description = "Official-source evidence collection and report completion gates"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "iscream2124"}]
dependencies = ["pypdf>=5.0"]

[project.scripts]
evidence-report = "evidence_report.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

